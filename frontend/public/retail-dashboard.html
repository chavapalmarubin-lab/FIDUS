    const { useState, useEffect, useCallback, createContext, useContext, useRef } = React;

    // ============================================================
    // CONFIG

    const API_BASE = window.location.origin.includes('localhost')
      ? ''
      : window.location.origin;

    // ============================================================
    // AUTH CONTEXT
    // ============================================================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('fidus_token'));
      const [loading, setLoading] = useState(true);
      const [morphoData, setMorphoData] = useState(null);

      const fetchProfile = useCallback(async (t) => {
        try {
          const res = await fetch(`${API_BASE}/api/user/profile`, {
            headers: { Authorization: `Bearer ${t}` }
          });
          if (!res.ok) throw new Error('Auth failed');
          const data = await res.json();
          setUser(data);
          setMorphoData(data.morpho || null);
          return data;
        } catch {
          localStorage.removeItem('fidus_token');
          setToken(null);
          setUser(null);
          return null;
        }
      }, []);

      useEffect(() => {
        if (token) {
          fetchProfile(token).finally(() => setLoading(false));
        } else {
          setLoading(false);
        }
      }, [token, fetchProfile]);

      const login = async (email, password) => {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        localStorage.setItem('fidus_token', data.token);
        setToken(data.token);
        await fetchProfile(data.token);
        return data;
      };

      const logout = () => {
        fetch(`${API_BASE}/api/auth/logout`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        }).catch(() => {});
        localStorage.removeItem('fidus_token');
        setToken(null);
        setUser(null);
        setMorphoData(null);
      };

      const refreshProfile = () => token ? fetchProfile(token) : Promise.resolve(null);

      return (
        <AuthContext.Provider value={{ user, token, morphoData, loading, login, logout, refreshProfile }}>
          {children}
        </AuthContext.Provider>
      );
    }

    function useRoute() {
      const [route, setRoute] = useState(window.location.hash.slice(1) || '/login');

        const handler = () => setRoute(window.location.hash.slice(1) || '/login');
        window.addEventListener('hashchange', handler);
        return () => window.removeEventListener('hashchange', handler);
      }, []);
      const navigate = (path) => { window.location.hash = path; };
      return { route, navigate };

    function LoginPage({ navigate }) {
      const { login } = useAuth();
      const { t } = useLang();

      const [showPw, setShowPw] = useState(false);
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          await login(email, password);
          navigate('/dashboard');
        } catch (err) {
          setError(t.loginError);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>

              <p style={{ color: '#64748b', fontSize: 13 }}>{t.investmentPortal}</p>
            </div>

            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <input type="email" placeholder={t.email} value={email} onChange={e => setEmail(e.target.value)}

              <div style={{ position: 'relative' }}>
                <input type={showPw ? 'text' : 'password'} placeholder={t.password} value={password}
                  onChange={e => setPassword(e.target.value)} required style={{ ...S.input, paddingRight: 48 }} />
                <button type="button" onClick={() => setShowPw(!showPw)}
                  style={{ position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)', background: 'none', border: 'none', cursor: 'pointer', color: '#64748b' }}>
                  <Icon name={showPw ? 'eye-off' : 'eye'} size={18} />
                </button>
              </div>
              {error && <p style={{ color: '#ef4444', fontSize: 13, textAlign: 'center' }}>{error}</p>}
              <button type="submit" disabled={loading} style={{ ...S.btn, width: '100%', justifyContent: 'center', opacity: loading ? 0.7 : 1 }}>
                {loading ? <><span className="spinner" /> {t.loggingIn}</> : t.login}
              </button>
            </form>

            <div style={{ textAlign: 'center', marginTop: 20 }}>
              <p style={{ color: '#64748b', fontSize: 13 }}>{t.noAccount}</p>
              <a href="https://my.lucrumfx.com/auth/signup?ib=fiso3999&ref=STD%20IB" target="_blank" rel="noopener noreferrer"
                style={{ color: '#0ea5e9', fontSize: 14, fontWeight: 600 }}>{t.openAccount}</a>
            </div>
            <div style={{ textAlign: 'center', marginTop: 12 }}>
              <a href="https://fidus-investment-platform.onrender.com/retail"
                style={{ color: '#475569', fontSize: 12 }}>{t.backToRetail}</a>
            </div>
          </div>
        </div>
      );

    // ============================================================
    // KYC UPLOAD PAGE
    // ============================================================
    function KYCPage() {
      const { token, morphoData } = useAuth();
      const { t } = useLang();
      const [idFile, setIdFile] = useState(null);
      const [resFile, setResFile] = useState(null);
      const [uploadingId, setUploadingId] = useState(false);
      const [uploadingRes, setUploadingRes] = useState(false);
      const [idStatus, setIdStatus] = useState(null);
      const [resStatus, setResStatus] = useState(null);
      const [loadingStatus, setLoadingStatus] = useState(true);

      useEffect(() => {
        fetchKycStatus();
      }, []);

      const fetchKycStatus = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/kyc/status?token=${token}`);
          const data = await res.json();
          if (data.documents?.id_document) setIdStatus(data.documents.id_document);
          if (data.documents?.proof_of_residence) setResStatus(data.documents.proof_of_residence);
        } catch (e) { console.log('KYC status error:', e); }
        finally { setLoadingStatus(false); }
      };

      const uploadDoc = async (docType) => {
        const file = docType === 'id_document' ? idFile : resFile;
        if (!file) return;
        const setUploading = docType === 'id_document' ? setUploadingId : setUploadingRes;
        setUploading(true);
        try {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('doc_type', docType);
          formData.append('token', token);
          const res = await fetch(`${API_BASE}/api/kyc/upload`, { method: 'POST', body: formData });
          const data = await res.json();
          if (data.success) {
            if (docType === 'id_document') { setIdStatus(data.document); setIdFile(null); }
            else { setResStatus(data.document); setResFile(null); }
            alert(t.uploadSuccess);
          } else { throw new Error(data.detail || 'Upload failed'); }
        } catch (e) { alert(e.message); }
        finally { setUploading(false); }
      };

      const statusBadge = (status) => {
        const map = {
          pending_review: { color: '#f59e0b', label: t.pendingReview },
          submitted_to_lucrum: { color: '#0ea5e9', label: t.sentToLucrum },
          approved: { color: '#10b981', label: t.approved },
          rejected: { color: '#ef4444', label: t.rejected },
        };
        return map[status] || { color: '#64748b', label: status };
      };

      const kyc = morphoData?.kyc;

      const DocSection = ({ title, subtitle, icon, docType, file, setFile, uploading, docStatus }) => (
        <div style={S.card}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 4 }}>
            <Icon name={icon} size={22} color="#0ea5e9" />
            <h3 style={{ fontSize: 17, fontWeight: 700, color: '#fff' }}>{title}</h3>
          </div>
          <p style={{ fontSize: 12, color: '#64748b', marginBottom: 16, marginLeft: 32 }}>{subtitle}</p>

          {docStatus ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: 14, background: 'rgba(14,165,233,0.06)', borderRadius: 10 }}>
              <Icon name="file-text" size={24} color="#0ea5e9" />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: '#d1d5db', marginBottom: 4 }}>{docStatus.original_filename}</div>
                <span style={S.badge(statusBadge(docStatus.status).color)}>
                  <span style={{ width: 6, height: 6, borderRadius: 3, background: statusBadge(docStatus.status).color, display: 'inline-block' }} />
                  {statusBadge(docStatus.status).label}
                </span>
              </div>
              <label style={{ cursor: 'pointer', color: '#64748b' }}>
                <Icon name="refresh" size={18} />
                <input type="file" accept="image/*,.pdf" style={{ display: 'none' }}
                  onChange={e => { if (e.target.files[0]) setFile(e.target.files[0]); }} />
              </label>
            </div>
          ) : file ? (
            <div>
              <div style={{ padding: 14, background: 'rgba(255,255,255,0.04)', borderRadius: 10, marginBottom: 10 }}>
                <div style={{ fontSize: 13, color: '#d1d5db' }}>{file.name}</div>
                <div style={{ fontSize: 11, color: '#64748b' }}>{(file.size / 1024).toFixed(1)} KB</div>
              </div>
              <div style={{ display: 'flex', gap: 10 }}>
                <label style={{ ...S.btnOutline, flex: 1, textAlign: 'center', cursor: 'pointer' }}>
                  Change
                  <input type="file" accept="image/*,.pdf" style={{ display: 'none' }}
                    onChange={e => { if (e.target.files[0]) setFile(e.target.files[0]); }} />
                </label>
                <button onClick={() => uploadDoc(docType)} disabled={uploading}
                  style={{ ...S.btn, flex: 1, justifyContent: 'center', opacity: uploading ? 0.6 : 1 }}>
                  {uploading ? <span className="spinner" /> : <><Icon name="upload" size={16} /> {t.upload}</>}
                </button>
              </div>
            </div>
          ) : (
            <label style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, padding: '28px 16px', border: '2px dashed rgba(14,165,233,0.25)', borderRadius: 12, cursor: 'pointer' }}>
              <Icon name="upload" size={28} color="#0ea5e9" />
              <span style={{ fontSize: 14, color: '#0ea5e9', fontWeight: 500 }}>{t.selectFile}</span>
              <input type="file" accept="image/*,.pdf" style={{ display: 'none' }}
                onChange={e => { if (e.target.files[0]) setFile(e.target.files[0]); }} />
            </label>
          )}
        </div>
      );

      return (
        <div className="fade-in">
          <h1 style={{ ...S.heading, marginBottom: 8 }}>{t.identityVerification}</h1>
          <p style={{ fontSize: 13, color: '#0ea5e9', fontWeight: 500, marginBottom: 24 }}>LUCRUM KYC</p>

          {/* Info banner */}
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: 14, background: 'rgba(14,165,233,0.06)', borderRadius: 10, marginBottom: 24, borderLeft: '3px solid #0ea5e9' }}>
            <Icon name="shield-check" size={20} color="#0ea5e9" />
            <p style={{ fontSize: 13, color: '#94a3b8', lineHeight: 1.6, flex: 1 }}>{t.uploadInfo}</p>
          </div>

          {/* KYC Checklist from Morpho */}
          {kyc && (
            <div style={{ ...S.card, marginBottom: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
                <Icon name={kyc.fully_verified ? 'shield-check' : 'shield'} size={24}
                  color={kyc.fully_verified ? '#10b981' : '#f59e0b'} />
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: kyc.fully_verified ? '#10b981' : '#f59e0b' }}>
                    {kyc.fully_verified ? t.fullyVerified : t.verificationPending}
                  </div>
                </div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {[
                  { key: 'email_validated', label: t.emailVerified },
                  { key: 'phone_validated', label: t.phoneVerified },
                  { key: 'document_validated', label: t.docVerified },
                  { key: 'residence_validated', label: t.residenceVerified },
                ].map(item => (
                  <div key={item.key} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <Icon name={kyc[item.key] ? 'check-circle' : 'circle'} size={18}
                      color={kyc[item.key] ? '#10b981' : '#4b5563'} />
                    <span style={{ fontSize: 13, color: kyc[item.key] ? '#d1d5db' : '#6b7280' }}>{item.label}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(340px, 1fr))', gap: 20, marginBottom: 32 }}>
            <DocSection title={t.idDocument} subtitle={t.passportOrId} icon="id-card"
              docType="id_document" file={idFile} setFile={setIdFile}
              uploading={uploadingId} docStatus={idStatus} />
            <DocSection title={t.proofResidence} subtitle={t.utilityBill} icon="home"
              docType="proof_of_residence" file={resFile} setFile={setResFile}
              uploading={uploadingRes} docStatus={resStatus} />
          </div>

          {/* What happens next */}
          <div style={S.card}>
            <h3 style={{ fontSize: 16, fontWeight: 700, color: '#fff', marginBottom: 16 }}>{t.whatHappens}</h3>
            {[t.step1, t.step2, t.step3].map((step, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
                <div style={{ width: 28, height: 28, borderRadius: 14, background: 'rgba(14,165,233,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700, color: '#0ea5e9', flexShrink: 0 }}>{i + 1}</div>
                <span style={{ fontSize: 13, color: '#94a3b8' }}>{step}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

        (async () => {
          try {
            const res = await fetch(`${API_BASE}/api/transactions?limit=50`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const data = await res.json();
            setTransactions(data || []);
          } catch (e) { console.log('Transactions error:', e); }
          finally { setLoading(false); }
        })();
      }, [token]);

      const typeLabel = (type) => ({ deposit: t.deposit, withdrawal: t.withdrawal, return: t.return }[type] || type);
      const statusLabel = (s) => ({ completed: t.completed, pending: t.pending, failed: t.failed }[s] || s);
      const statusColor = (s) => ({ completed: '#10b981', pending: '#f59e0b', failed: '#ef4444' }[s] || '#64748b');
      const typeColor = (type) => ({ deposit: '#10b981', withdrawal: '#ef4444', return: '#0ea5e9' }[type] || '#fff');

      if (loading) return <div style={{ padding: 40, textAlign: 'center' }}><span className="spinner" /></div>;

      return (
        <div className="fade-in">
          <h1 style={{ ...S.heading, marginBottom: 24 }}>{t.transactions}</h1>

          {transactions.length === 0 ? (
            <div style={{ ...S.card, textAlign: 'center', padding: 48 }}>
              <Icon name="list" size={48} color="rgba(255,255,255,0.1)" />
              <p style={{ color: '#64748b', marginTop: 16 }}>{t.noTransactions}</p>
            </div>
          ) : (
            <div style={S.card}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
                    <th style={{ textAlign: 'left', padding: '12px 8px', fontSize: 12, fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>{t.type}</th>
                    <th style={{ textAlign: 'right', padding: '12px 8px', fontSize: 12, fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>{t.amount}</th>
                    <th style={{ textAlign: 'left', padding: '12px 8px', fontSize: 12, fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>{t.status}</th>
                    <th style={{ textAlign: 'right', padding: '12px 8px', fontSize: 12, fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>{t.date}</th>
                  </tr>
                </thead>
                <tbody>
                  {transactions.map((tx, i) => (
                    <tr key={i} style={{ borderBottom: '1px solid rgba(255,255,255,0.04)' }}>
                      <td style={{ padding: '14px 8px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                          <div style={{ width: 8, height: 8, borderRadius: 4, background: typeColor(tx.type) }} />
                          <span style={{ fontSize: 14, fontWeight: 600, color: '#fff' }}>{typeLabel(tx.type)}</span>
                        </div>
                        <div style={{ fontSize: 12, color: '#64748b', marginTop: 2, marginLeft: 16 }}>{tx.description}</div>
                      </td>
                      <td style={{ padding: '14px 8px', textAlign: 'right', fontSize: 15, fontWeight: 700, fontFamily: 'monospace', color: typeColor(tx.type) }}>
                        {tx.type === 'withdrawal' ? '-' : '+'}${Number(tx.amount).toLocaleString('en-US', { minimumFractionDigits: 2 })}
                      </td>
                      <td style={{ padding: '14px 8px' }}>
                        <span style={S.badge(statusColor(tx.status))}>{statusLabel(tx.status)}</span>
                      </td>
                      <td style={{ padding: '14px 8px', textAlign: 'right', fontSize: 12, color: '#64748b' }}>
                        {tx.createdAt ? new Date(tx.createdAt).toLocaleDateString() : '-'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // SETTINGS PAGE
    // ============================================================
    function SettingsPage({ navigate }) {
      const { user, token, morphoData, logout } = useAuth();
      const { t, lang, setLanguage } = useLang();
      const kyc = morphoData?.kyc;

      return (
        <div className="fade-in">
          <h1 style={{ ...S.heading, marginBottom: 24 }}>{t.settings}</h1>

          {/* Profile */}
          <div style={{ ...S.card, marginBottom: 20 }}>
            <h3 style={{ fontSize: 14, fontWeight: 600, color: '#64748b', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 16 }}>{t.profile}</h3>
            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <div style={{ width: 56, height: 56, borderRadius: 28, background: '#0ea5e9', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, fontWeight: 700, color: '#fff' }}>
                {user?.name?.charAt(0).toUpperCase() || 'U'}
              </div>
              <div>
                <div style={{ fontSize: 18, fontWeight: 600, color: '#fff' }}>{user?.name || 'User'}</div>
                <div style={{ fontSize: 14, color: '#64748b', marginTop: 2 }}>{user?.email || ''}</div>
                {user?.phone && <div style={{ fontSize: 13, color: '#64748b', marginTop: 2 }}>{user.phone}</div>}
              </div>
            </div>
          </div>

          {/* KYC Status */}
          {kyc && (
            <div style={{ ...S.card, marginBottom: 20 }}>
              <h3 style={{ fontSize: 14, fontWeight: 600, color: '#64748b', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 16 }}>{t.kycStatus}</h3>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
                <Icon name={kyc.fully_verified ? 'shield-check' : 'shield'} size={28} color={kyc.fully_verified ? '#10b981' : '#f59e0b'} />
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: kyc.fully_verified ? '#10b981' : '#f59e0b' }}>
                    {kyc.fully_verified ? t.fullyVerified : t.verificationPending}
                  </div>
                </div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                {[
                  { key: 'email_validated', label: t.emailVerified },
                  { key: 'phone_validated', label: t.phoneVerified },
                  { key: 'document_validated', label: t.docVerified },
                  { key: 'residence_validated', label: t.residenceVerified },
                ].map(item => (
                  <div key={item.key} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <Icon name={kyc[item.key] ? 'check-circle' : 'circle'} size={18}
                      color={kyc[item.key] ? '#10b981' : '#4b5563'} />
                    <span style={{ fontSize: 13, color: kyc[item.key] ? '#d1d5db' : '#6b7280' }}>{item.label}</span>
                  </div>
                ))}
              </div>
              {!kyc.fully_verified && (
                <button onClick={() => navigate('/kyc')}
                  style={{ ...S.btn, width: '100%', justifyContent: 'center', marginTop: 16 }}>
                  <Icon name="upload" size={16} /> {t.uploadDocs}
                </button>
              )}
            </div>
          )}

          {/* Language */}
          <div style={{ ...S.card, marginBottom: 20 }}>
            <h3 style={{ fontSize: 14, fontWeight: 600, color: '#64748b', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 16 }}>{t.language}</h3>
            <div style={{ display: 'flex', gap: 12 }}>
              {[{ code: 'en', label: 'English' }, { code: 'es', label: 'Espanol' }].map(l => (
                <button key={l.code} onClick={() => setLanguage(l.code)}
                  style={{ flex: 1, padding: 16, borderRadius: 12, border: lang === l.code ? '1px solid #0ea5e9' : '1px solid rgba(255,255,255,0.08)', background: lang === l.code ? 'rgba(14,165,233,0.1)' : 'rgba(255,255,255,0.03)', color: lang === l.code ? '#0ea5e9' : '#64748b', fontSize: 16, fontWeight: lang === l.code ? 600 : 500, cursor: 'pointer', textAlign: 'center' }}>
                  {l.label}
                </button>
              ))}
            </div>
          </div>

          {/* Quick Links */}
          <div style={{ ...S.card, marginBottom: 20 }}>
            <h3 style={{ fontSize: 14, fontWeight: 600, color: '#64748b', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 16 }}>Links</h3>
            <a href="https://my.lucrumfx.com" target="_blank" rel="noopener noreferrer"
              style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 0', borderBottom: '1px solid rgba(255,255,255,0.04)', color: '#fff', fontSize: 15, fontWeight: 500 }}>
              <Icon name="external" size={18} color="#0ea5e9" /> {t.goToLucrum}
            </a>
          </div>

          {/* Logout */}
          <button onClick={() => { logout(); navigate('/login'); }}
            style={{ width: '100%', padding: 16, borderRadius: 12, border: 'none', background: 'rgba(239,68,68,0.08)', color: '#ef4444', fontSize: 16, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8 }}>
            <Icon name="log-out" size={18} color="#ef4444" /> {t.logout}
          </button>

          <p style={{ textAlign: 'center', color: '#64748b', fontSize: 12, marginTop: 24 }}>FIDUS Web App v2.0.0</p>
        </div>
      );
    }

    // ============================================================
    // APP ROOT
    // ============================================================
    function App() {
      const { route, navigate } = useRoute();
      const { user, loading } = useAuth();

      useEffect(() => {
        if (!loading) {
          if (user && (route === '/login' || route === '/')) {
            navigate('/dashboard');
          } else if (!user && route !== '/login') {
            navigate('/login');
          }
        }
      }, [user, loading, route]);

      if (loading) {
        return (
          <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <span className="spinner" style={{ width: 32, height: 32, borderWidth: 3 }} />
          </div>
        );
      }

      if (!user || route === '/login') {
        return <LoginPage navigate={navigate} />;
      }

      let PageComponent;
      switch (route) {
        case '/dashboard': PageComponent = DashboardPage; break;
        case '/kyc': PageComponent = KYCPage; break;
        case '/challenges': PageComponent = ChallengesPage; break;
        case '/transactions': PageComponent = TransactionsPage; break;
        case '/settings': PageComponent = SettingsPage; break;
        default: PageComponent = DashboardPage;
      }

      return (
        <DashboardLayout route={route} navigate={navigate}>
          {route === '/settings' ? <PageComponent navigate={navigate} /> : <PageComponent />}
        </DashboardLayout>
      );
    }

    // ============================================================
    // MOUNT
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <LangProvider>
        <AuthProvider>
          <App />
        </AuthProvider>
      </LangProvider>
    );
  </script>
</body>
</html>
