name: Full Historical Backfill - Account 2122

on:
  workflow_dispatch:

jobs:
  backfill-2122:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: "Find and restart bridge with 180-day backfill"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 10m
          script: |
            Write-Host "=== LUCRUM Bridge Full Backfill ===" -ForegroundColor Cyan
            
            # Find the bridge script
            Write-Host "Searching for mt5_bridge_lucrum.py..."
            $found = $null
            $searchPaths = @("C:\", "D:\", "E:\")
            foreach ($path in $searchPaths) {
              if (Test-Path $path) {
                $files = Get-ChildItem -Path $path -Filter "mt5_bridge_lucrum.py" -Recurse -ErrorAction SilentlyContinue -Depth 5
                if ($files) {
                  $found = $files[0]
                  break
                }
              }
            }
            
            if (-not $found) {
              Write-Host "Searching for any mt5_bridge*.py..."
              $files = Get-ChildItem -Path "C:\" -Filter "mt5_bridge*.py" -Recurse -ErrorAction SilentlyContinue -Depth 5
              foreach ($f in $files) {
                Write-Host "  Found: $($f.FullName)"
              }
              Write-Host "ERROR: mt5_bridge_lucrum.py not found" -ForegroundColor Red
              exit 1
            }
            
            Write-Host "Found: $($found.FullName)" -ForegroundColor Green
            
            # Stop existing bridge
            Write-Host "Stopping existing bridge..."
            $pyProcs = Get-Process python* -ErrorAction SilentlyContinue
            if ($pyProcs) { $pyProcs | Stop-Process -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 5
            
            # Set environment variable for full backfill
            [System.Environment]::SetEnvironmentVariable("INITIAL_BACKFILL_DAYS", "180", "Process")
            $env:INITIAL_BACKFILL_DAYS = "180"
            
            Write-Host "INITIAL_BACKFILL_DAYS set to 180" -ForegroundColor Yellow
            Write-Host "Starting bridge..."
            
            # Start the bridge
            Set-Location $found.DirectoryName
            Start-Process -FilePath "python" -ArgumentList $found.Name -NoNewWindow
            
            Write-Host "Bridge started. Waiting 3 minutes for backfill..."
            Start-Sleep -Seconds 180
            
            Write-Host "Backfill window complete" -ForegroundColor Green
      
      - name: "Verify in MongoDB"
        env:
          MONGO_URL: "mongodb+srv://chavapalmarubin_db_user:2170TenochSecure@fidus.y1p9be2.mongodb.net/fidus_production"
        run: |
          pip install pymongo > /dev/null 2>&1
          python3 -c "
          from pymongo import MongoClient
          c = MongoClient('${{ env.MONGO_URL }}')
          db = c.fidus_production
          count = db.mt5_deals_history.count_documents({'account': 2122})
          acc = db.mt5_accounts.find_one({'account': 2122}, {'_id': 0, 'equity': 1})
          print(f'Account 2122 deals: {count}')
          print(f'Equity: {acc.get(\"equity\", \"N/A\") if acc else \"N/A\"}')
          print('FULL HISTORY' if count >= 200 else f'Partial: {count}/224')
          c.close()
          "
