name: Deploy Updated MT5 Bridge (Multi-Broker Support)

on:
  workflow_dispatch:

jobs:
  deploy-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: "Diagnose Current VPS State"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 5m
          script: |
            Write-Host "================================================"
            Write-Host "  VPS DIAGNOSTIC" -ForegroundColor Cyan
            Write-Host "================================================"
            Write-Host "=== Port 8000 Status ===" -ForegroundColor Yellow
            $listening = netstat -ano | Select-String ":8000.*LISTENING"
            if ($listening) { Write-Host $listening -ForegroundColor Green } else { Write-Host "Port 8000: Nothing listening" -ForegroundColor Red }
            Write-Host "=== Python Processes ===" -ForegroundColor Yellow
            Get-Process python* -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, CPU -AutoSize
            Write-Host "=== MT5 Terminal ===" -ForegroundColor Yellow
            Get-Process terminal64* -ErrorAction SilentlyContinue | Format-Table Id, ProcessName -AutoSize
            Write-Host "=== Bridge Directory ===" -ForegroundColor Yellow
            if (Test-Path "C:\mt5_bridge_service") { Get-ChildItem "C:\mt5_bridge_service\*.py" | Format-Table Name, Length, LastWriteTime -AutoSize } else { Write-Host "NOT FOUND" -ForegroundColor Red }
      
      - name: "Stop Existing Processes"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 3m
          script: |
            Write-Host "=== Stopping Existing Processes ===" -ForegroundColor Cyan
            Get-ScheduledTask | Where-Object { $_.TaskName -like "*MT5*" -or $_.TaskName -like "*Bridge*" } | ForEach-Object { Stop-ScheduledTask -TaskName $_.TaskName -ErrorAction SilentlyContinue }
            $pyProcs = Get-Process python* -ErrorAction SilentlyContinue
            if ($pyProcs) { $pyProcs | Stop-Process -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 3
            Write-Host "Processes stopped" -ForegroundColor Green
      
      - name: "Deploy Updated Bridge Script"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 5m
          script: |
            Write-Host "=== Deploying Updated Bridge Script ===" -ForegroundColor Cyan
            $deployDir = "C:\mt5_bridge_service"
            if (-not (Test-Path $deployDir)) { New-Item -ItemType Directory -Path $deployDir -Force | Out-Null }
            Set-Location $deployDir
            if (Test-Path "mt5_bridge_api_service.py") { Copy-Item "mt5_bridge_api_service.py" "mt5_bridge_api_service.py.backup" -Force; Write-Host "Backed up current script" -ForegroundColor Green }
            Write-Host "Downloading updated script..." -ForegroundColor Yellow
            $url = "https://raw.githubusercontent.com/chavapalmarubin-lab/fidus-investment-platform/main/vps/mt5_bridge_api_service.py"
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri $url -OutFile "mt5_bridge_api_service.py" -TimeoutSec 60
            $size = (Get-Item "mt5_bridge_api_service.py").Length
            Write-Host "Downloaded: $size bytes" -ForegroundColor Green
            if (-not (Test-Path "logs")) { New-Item -ItemType Directory -Path "logs" -Force | Out-Null }
      
      - name: "Start MT5 Bridge Service"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 3m
          script: |
            Write-Host "=== Starting MT5 Bridge Service ===" -ForegroundColor Cyan
            Set-Location "C:\mt5_bridge_service"
            Start-Process -FilePath "python" -ArgumentList "mt5_bridge_api_service.py" -WorkingDirectory "C:\mt5_bridge_service" -WindowStyle Hidden -RedirectStandardOutput "logs\service_output.log" -RedirectStandardError "logs\service_error.log"
            Write-Host "Waiting 25 seconds..." -ForegroundColor Yellow
            Start-Sleep -Seconds 25
            Write-Host "Service started" -ForegroundColor Green
      
      - name: "Verify Service is Running"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 3m
          script: |
            Write-Host "=== Verifying Service ===" -ForegroundColor Cyan
            $listening = netstat -ano | Select-String ":8000.*LISTENING"
            if ($listening) { Write-Host "SUCCESS: Port 8000 is listening!" -ForegroundColor Green } else { Write-Host "ERROR: Port 8000 NOT listening" -ForegroundColor Red; if (Test-Path "C:\mt5_bridge_service\logs\service_error.log") { Get-Content "C:\mt5_bridge_service\logs\service_error.log" -Tail 30 } }
            try { $r = Invoke-RestMethod -Uri "http://localhost:8000/api/mt5/bridge/health" -TimeoutSec 10; Write-Host "Health OK" -ForegroundColor Green } catch { Write-Host "Health failed: $_" -ForegroundColor Red }
            try { $r = Invoke-RestMethod -Uri "http://localhost:8000/api/mt5/account/55705730/info" -TimeoutSec 15; Write-Host "TickMill OK: $($r | ConvertTo-Json -Compress)" -ForegroundColor Green } catch { Write-Host "TickMill: $_" -ForegroundColor Yellow }
      
      - name: "Test External Access"
        run: |
          curl -s --connect-timeout 15 http://92.118.45.135:8000/api/mt5/bridge/health || echo "External connection failed"
